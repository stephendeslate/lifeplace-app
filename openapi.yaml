          type: string
          nullable: true
        company:
          type: string
          nullable: true

    ClientList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
          readOnly: true
        profile:
          $ref: '#/components/schemas/ClientProfile'
        has_account:
          type: boolean
          readOnly: true

    ClientDetail:
      allOf:
