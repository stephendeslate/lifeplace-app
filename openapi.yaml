        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
      required:
        - email
        - first_name
        - last_name

    UserCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
      required:
        - email
        - first_name
        - last_name
        - password

    UserLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password

    # Client Management Schemas
    ClientProfile:
      type: object
