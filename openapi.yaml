openapi: 3.0.3
info:
  title: LifePlace API
  version: 1.0.0
  description: >
    Comprehensive API documentation for LifePlace Event Management Platform.
    Built with Django REST Framework following Domain-Driven Design principles.
    This CRM system manages the complete event lifecycle from booking flows 
    to payment processing, contracts, and client communications.
  contact:
    name: LifePlace API Support
    url: https://api.crm.example.com/support
  license:
    name: Proprietary
    url: https://api.crm.example.com/license

servers:
  - url: https://api.crm.example.com/v1
    description: Production server
  - url: https://staging-api.crm.example.com/v1
    description: Staging server
  - url: http://localhost:8000
    description: Development server

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User account management and administration
  - name: Clients
    description: Client management and invitations
  - name: Events
    description: Event lifecycle management and client portal
  - name: BookingFlow
    description: Multi-step booking flow engine with dynamic forms
  - name: Communications
    description: Email/SMS templates and messaging system
  - name: Products
    description: Product catalog, categories, and pricing management
  - name: Payments
    description: Payment processing, invoicing, and gateway management
  - name: Sales
    description: Quote generation and management system
  - name: Questionnaires
    description: Dynamic form builder and response management
  - name: Workflows
    description: Workflow automation and stage management
  - name: Contracts
    description: Contract generation, signatures, and amendments
  - name: Notes
    description: Universal notes system with cross-domain support
  - name: Notifications
    description: Multi-channel notification and preference management
  - name: Analytics
    description: Event tracking, reporting, and business intelligence

paths:
  # Authentication Endpoints
  /api/users/token/:
    post:
      tags: [Authentication]
      summary: Obtain JWT token pair
      description: Get access and refresh tokens for authentication
      operationId: token_obtain_pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Tokens generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  refresh:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/token/refresh/:
    post:
      tags: [Authentication]
      summary: Refresh JWT access token
      description: Generate new access token using refresh token
      operationId: token_refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh:
                  type: string
      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/login/:
    post:
      tags: [Authentication]
      summary: Enhanced user login
      description: Login with enhanced security and JWT token generation
      operationId: user_login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  access:
                    type: string
                  refresh:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/users/logout/:
    post:
      tags: [Authentication]
      summary: Secure logout
      description: Logout with JWT token blacklisting
      operationId: secure_logout
      responses:
        '200':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/register/:
    post:
      tags: [Authentication]
      summary: Client registration
      description: Public client registration endpoint
      operationId: client_register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Client registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  access:
                    type: string
                  refresh:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # User Management Endpoints
  /api/users/:
    get:
      tags: [Users]
      summary: List users
      description: Get paginated list of users with search functionality
      operationId: list_users
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create user
      description: Create a new user account
      operationId: create_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}/:
    get:
      tags: [Users]
      summary: Get user details
      description: Get detailed information about a specific user
      operationId: get_user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update user
      description: Update user account information
      operationId: update_user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Delete user
      description: Delete user account
      operationId: delete_user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: User deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/me/:
    get:
      tags: [Users]
      summary: Get current user profile
      description: Get current authenticated user's profile
      operationId: current_user_profile
      responses:
        '200':
          description: Current user profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Client Management Endpoints
  /api/clients/:
    get:
      tags: [Clients]
      summary: List clients
      description: Get paginated list of clients
      operationId: list_clients
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Clients retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Clients]
      summary: Create client
      description: Create a new client
      operationId: create_client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      responses:
        '201':
          description: Client created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/clients/{id}/:
    get:
      tags: [Clients]
      summary: Get client details
      description: Get detailed client information
      operationId: get_client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Client details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clients]
      summary: Update client
      description: Update client information
      operationId: update_client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdate'
      responses:
        '200':
          description: Client updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # Event Management Endpoints
  /api/events/events/:
    get:
      tags: [Events]
      summary: List events
      description: Get paginated list of events
      operationId: list_events
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [inquiry, booked, in_progress, completed, cancelled]
        - name: client_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Events]
      summary: Create event
      description: Create a new event
      operationId: create_event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/events/events/{id}/:
    get:
      tags: [Events]
      summary: Get event details
      description: Get detailed event information
      operationId: get_event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Events]
      summary: Update event
      description: Update event information
      operationId: update_event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # BookingFlow Endpoints
  /api/bookingflow/flows/:
    get:
      tags: [BookingFlow]
      summary: List booking flows
      description: Get all booking flows
      operationId: list_booking_flows
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Booking flows retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingFlowList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [BookingFlow]
      summary: Create booking flow
      description: Create a new booking flow
      operationId: create_booking_flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingFlow'
      responses:
        '201':
          description: Booking flow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFlow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/bookingflow/flows/{id}/:
    get:
      tags: [BookingFlow]
      summary: Get booking flow
      description: Get booking flow details
      operationId: get_booking_flow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking flow retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFlow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/bookingflow/public/flows/:
    get:
      tags: [BookingFlow]
      summary: List public booking flows
      description: Get active booking flows for public use
      operationId: list_public_booking_flows
      security: []
      responses:
        '200':
          description: Public booking flows retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicBookingFlow'

  /api/bookingflow/public/flows/{id}/start_session/:
    post:
      tags: [BookingFlow]
      summary: Start booking session
      description: Start a new booking flow session
      operationId: start_booking_session
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Session started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_uuid:
                    type: string
                    format: uuid
                  current_step:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # Analytics Domain Endpoints
  /api/analytics/metrics/:
    get:
      tags: [Analytics]
      summary: List metric definitions
      description: Get all defined metrics for analytics tracking
      operationId: list_metrics
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMetricList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Analytics]
      summary: Create metric definition
      description: Define a new metric for tracking
      operationId: create_metric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricDefinition'
      responses:
        '201':
          description: Metric created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/analytics/metrics/{id}/:
    get:
      tags: [Analytics]
      summary: Get metric details
      description: Retrieve details of a specific metric
      operationId: get_metric
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Metric retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Analytics]
      summary: Update metric
      description: Update metric definition
      operationId: update_metric
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricDefinition'
      responses:
        '200':
          description: Metric updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Analytics]
      summary: Delete metric
      description: Delete a metric definition
      operationId: delete_metric
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Metric deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/analytics/dashboards/:
    get:
      tags: [Analytics]
      summary: List dashboards
      description: Get all analytics dashboards
      operationId: list_dashboards
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Dashboards retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDashboardList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Analytics]
      summary: Create dashboard
      description: Create a new analytics dashboard
      operationId: create_dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dashboard'
      responses:
        '201':
          description: Dashboard created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/analytics/events/:
    get:
      tags: [Analytics]
      summary: List analytics events
      description: Get tracked analytics events with filtering
      operationId: list_analytics_events
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - name: event_type
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnalyticsEventList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Analytics]
      summary: Track event
      description: Track a new analytics event
      operationId: track_event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEvent'
      responses:
        '201':
          description: Event tracked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/analytics/public/:
    post:
      tags: [Analytics]
      summary: Public event tracking
      description: Track events from client-side applications
      operationId: public_track_event
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAnalyticsEvent'
      responses:
        '201':
          description: Event tracked successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # Communications Domain Endpoints
  /api/communications/templates/:
    get:
      tags: [Communications]
      summary: List communication templates
      description: Get all email/SMS templates
      operationId: list_communication_templates
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - name: type
          in: query
          schema:
            type: string
            enum: [email, sms, push]
      responses:
        '200':
          description: Templates retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTemplateList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Communications]
      summary: Create template
      description: Create a new communication template
      operationId: create_template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunicationTemplate'
      responses:
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/communications/templates/{id}/:
    get:
      tags: [Communications]
      summary: Get template details
      description: Get communication template details
      operationId: get_template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Template retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Communications]
      summary: Update template
      description: Update communication template
      operationId: update_template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunicationTemplate'
      responses:
        '200':
          description: Template updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Communications]
      summary: Delete template
      description: Delete communication template
      operationId: delete_template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Template deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/communications/records/:
    get:
      tags: [Communications]
      summary: List communication records
