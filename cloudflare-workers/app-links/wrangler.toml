name = "lifeplace-app-links"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Route configuration - deploy to app.lifeplace.dev
# After deploying, add a Custom Domain in Cloudflare Dashboard:
# Workers & Pages -> lifeplace-app-links -> Settings -> Triggers -> Custom Domains -> Add: app.lifeplace.dev
routes = [
  { pattern = "app.lifeplace.dev/*", zone_name = "lifeplace.dev" }
]
