name: Mobile App Tests

on:
  push:
    branches: [main, develop, client-portal]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-tests.yml'

jobs:
  # ==========================================================================
  # UNIT & INTEGRATION TESTS
  # ==========================================================================
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./mobile-app/coverage/lcov.info
          flags: mobile-app
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            mobile-app/coverage/
            mobile-app/coverage/junit.xml
          retention-days: 14

  # ==========================================================================
  # E2E TESTS (iOS)
  # ==========================================================================
  e2e-tests-ios:
    name: E2E Tests (iOS)
    runs-on: macos-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro
        run: |
          brew tap mobile-dev-inc/tap
          brew install maestro

      - name: Cache Expo
        uses: actions/cache@v4
        with:
          path: ~/.expo
          key: ${{ runner.os }}-expo-${{ hashFiles('mobile-app/package-lock.json') }}

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build app for simulator
        run: |
          npx expo prebuild --platform ios --clean
          cd ios && xcodebuild -workspace lifeplace.xcworkspace \
            -scheme lifeplace \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -quiet

      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15"

      - name: Install app on simulator
        run: |
          xcrun simctl install booted ios/build/Build/Products/Debug-iphonesimulator/lifeplace.app

      - name: Run E2E tests
        run: npm run e2e
        env:
          EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload E2E screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-ios
          path: mobile-app/.maestro/screenshots/
          retention-days: 7

  # ==========================================================================
  # ACCESSIBILITY AUDIT
  # ==========================================================================
  accessibility:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: ./mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility tests
        run: npm test -- --testPathPattern="a11y" --passWithNoTests

  # ==========================================================================
  # SECURITY SCAN
  # ==========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for vulnerabilities
        run: npx better-npm-audit audit --level high
        continue-on-error: true

  # ==========================================================================
  # BUILD CHECK
  # ==========================================================================
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: ./mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export for web (build check)
        run: npx expo export --platform web
        continue-on-error: true

      - name: Verify Expo config
        run: npx expo config --type public

# ==========================================================================
# SUMMARY
# ==========================================================================
# This workflow:
# 1. Runs unit tests with Jest and coverage reporting
# 2. Uploads coverage to Codecov
# 3. Runs E2E tests with Maestro on iOS simulator (main branch only)
# 4. Performs accessibility audits
# 5. Runs security scans with npm audit
# 6. Verifies the app can build successfully
