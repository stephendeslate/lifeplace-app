# .github/workflows/ci-cd.yml
name: LifePlace CI/CD Pipeline

on:
  # Trigger on pushes to main branch
  push:
    branches: [ main ]
  
  # Trigger on pull requests to main branch
  pull_request:
    branches: [ main ]

  # Allow manual trigger
  workflow_dispatch:

jobs:
  # Job 1: Test Backend
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Run Django tests
      env:
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: False
        ENV: test
      run: |
        cd backend
        python manage.py migrate
        python manage.py test

    - name: Run Django system checks
      env:
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: False
        ENV: test
      run: |
        cd backend
        python manage.py check

  # Job 2: Test Frontend Apps
  test-frontend:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [admin-crm, client-portal]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend/${{ matrix.app }}
        npm ci

    - name: Install testing dependencies
      run: |
        cd frontend/${{ matrix.app }}
        npm install --save-dev jsdom @testing-library/react @testing-library/jest-dom @testing-library/user-event

    - name: Run TypeScript check (if script exists)
      run: |
        cd frontend/${{ matrix.app }}
        if npm run type-check --silent; then npm run type-check; else echo "type-check script not found, skipping"; fi

    - name: Run linting (if script exists)
      run: |
        cd frontend/${{ matrix.app }}
        if npm run lint --silent; then npm run lint; else echo "lint script not found, skipping"; fi

    - name: Run tests (if script exists)
      run: |
        cd frontend/${{ matrix.app }}
        if npm run test --silent; then npm run test; else echo "test script not found, skipping"; fi

    - name: Build application
      env:
        VITE_API_URL: https://test-api.example.com
        VITE_APP_ENV: test
      run: |
        cd frontend/${{ matrix.app }}
        npm run build

  # Job 3: Deploy Admin CRM (only on main branch)
  deploy-admin-crm:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/admin-crm/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend/admin-crm
        npm ci

    - name: Build application
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
        VITE_APP_ENV: production
      run: |
        cd frontend/admin-crm
        npm run build

    - name: Deploy to Netlify
      uses: nwtgck/actions-netlify@v3.0
      with:
        publish-dir: './frontend/admin-crm/dist'
        production-branch: main
        production-deploy: true
        netlify-config-path: './frontend/admin-crm/netlify.toml'
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_ADMIN_SITE_ID }}

  # Job 4: Deploy Client Portal (only on main branch)
  deploy-client-portal:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/client-portal/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend/client-portal
        npm ci

    - name: Build application
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
        VITE_APP_ENV: production
      run: |
        cd frontend/client-portal
        npm run build

    - name: Deploy to Netlify
      uses: nwtgck/actions-netlify@v3.0
      with:
        publish-dir: './frontend/client-portal/dist'
        production-branch: main
        production-deploy: true
        netlify-config-path: './frontend/client-portal/netlify.toml'
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_CLIENT_SITE_ID }}

  # Job 5: Notify on Success/Failure
  notify:
    needs: [deploy-admin-crm, deploy-client-portal]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Deployment Status
      run: |
        if [[ "${{ needs.deploy-admin-crm.result }}" == "success" && "${{ needs.deploy-client-portal.result }}" == "success" ]]; then
          echo "✅ Frontend deployments successful! Backend deployed automatically by Railway."
        else
          echo "❌ Some deployments failed"
          exit 1
        fi