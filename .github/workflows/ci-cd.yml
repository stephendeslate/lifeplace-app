# .github/workflows/ci-cd.yml
name: LifePlace CI/CD Pipeline

on:
  # Trigger on pushes to main branch
  push:
    branches: [ main ]

  # Trigger on pull requests to main branch
  pull_request:
    branches: [ main ]

  # Allow manual trigger
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  # Job 1: Test Backend
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Run Django tests
      env:
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: False
        ENV: test
      run: |
        cd backend
        python manage.py migrate
        python manage.py test

    - name: Run Django system checks
      env:
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: False
        ENV: test
      run: |
        cd backend
        python manage.py check

  # Job 2a: Test Admin CRM
  test-admin-crm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-admin-crm-${{ hashFiles('frontend/admin-crm/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-admin-crm-

    - name: Install dependencies
      run: |
        cd frontend/shared
        npm install
        cd ../admin-crm
        npm install --force

    - name: Run TypeScript check
      run: |
        cd frontend/admin-crm
        npm run type-check

    - name: Run linting
      run: |
        cd frontend/admin-crm
        npm run lint

    - name: Run tests
      run: |
        cd frontend/admin-crm
        npm run test

    - name: Build application
      env:
        VITE_API_URL: https://lifeplace-api.fly.dev
        VITE_APP_ENV: test
        VITE_SENTRY_RELEASE: "admin-crm@${{ github.sha }}"
      run: |
        cd frontend/admin-crm
        npm run build

    - name: Report bundle size
      run: |
        cd frontend/admin-crm
        echo "📦 Bundle Size Report for admin-crm"
        echo "=========================================="
        TOTAL_SIZE=$(du -sh dist/ | cut -f1)
        echo "Total build size: $TOTAL_SIZE"
        echo ""
        echo "JavaScript bundles:"
        find dist/assets -name "*.js" -type f -exec ls -lh {} \; | awk '{print $5 "\t" $9}' | sort -hr
        echo ""
        LARGE_BUNDLES=$(find dist/assets -name "*.js" -type f -size +1M)
        if [ -n "$LARGE_BUNDLES" ]; then
          echo "⚠️  WARNING: Found JavaScript bundles larger than 1MB:"
          echo "$LARGE_BUNDLES" | while read file; do
            SIZE=$(ls -lh "$file" | awk '{print $5}')
            echo "  - $(basename $file): $SIZE"
          done
        else
          echo "✅ All JavaScript bundles are under 1MB"
        fi

  # Job 2b: Test Client Portal
  test-client-portal:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-client-portal-${{ hashFiles('frontend/client-portal/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-client-portal-

    - name: Install dependencies
      run: |
        cd frontend/shared
        npm install
        cd ../client-portal
        npm install --force

    - name: Run TypeScript check
      run: |
        cd frontend/client-portal
        npm run type-check

    - name: Run linting
      run: |
        cd frontend/client-portal
        npm run lint

    - name: Run tests
      run: |
        cd frontend/client-portal
        npm run test

    - name: Build application
      env:
        VITE_API_URL: https://lifeplace-api.fly.dev
        VITE_APP_ENV: test
        VITE_SENTRY_RELEASE: "client-portal@${{ github.sha }}"
      run: |
        cd frontend/client-portal
        npm run build

    - name: Report bundle size
      run: |
        cd frontend/client-portal
        echo "📦 Bundle Size Report for client-portal"
        echo "=========================================="
        TOTAL_SIZE=$(du -sh build/client/ | cut -f1)
        echo "Total build size: $TOTAL_SIZE"
        echo ""
        echo "JavaScript bundles:"
        find build/client/assets -name "*.js" -type f -exec ls -lh {} \; | awk '{print $5 "\t" $9}' | sort -hr
        echo ""
        LARGE_BUNDLES=$(find build/client/assets -name "*.js" -type f -size +1M)
        if [ -n "$LARGE_BUNDLES" ]; then
          echo "⚠️  WARNING: Found JavaScript bundles larger than 1MB:"
          echo "$LARGE_BUNDLES" | while read file; do
            SIZE=$(ls -lh "$file" | awk '{print $5}')
            echo "  - $(basename $file): $SIZE"
          done
        else
          echo "✅ All JavaScript bundles are under 1MB"
        fi

  # Job 3a: Deploy Admin CRM to Cloudflare Pages (only on main branch)
  deploy-admin-crm:
    needs: [test-backend, test-admin-crm, test-client-portal]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-admin-crm-${{ hashFiles('frontend/admin-crm/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-admin-crm-

    - name: Install dependencies
      run: |
        cd frontend/shared
        npm install
        cd ../admin-crm
        npm install --force

    - name: Build for production
      env:
        VITE_API_URL: https://lifeplace-api.fly.dev
        VITE_APP_ENV: production
        VITE_SENTRY_RELEASE: "admin-crm@${{ github.sha }}"
        VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN_ADMIN_CRM }}
        VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      run: |
        cd frontend/admin-crm
        npm run build

    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        npx wrangler@3 pages deploy frontend/admin-crm/dist \
          --project-name=lifeplace-admin \
          --branch=main \
          --commit-hash=${{ github.sha }} \
          --commit-message="$(git log -1 --pretty=%s)"

  # Job 3b: Deploy Client Portal to Cloudflare Pages (only on main branch)
  deploy-client-portal:
    needs: [test-backend, test-admin-crm, test-client-portal]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-client-portal-${{ hashFiles('frontend/client-portal/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-client-portal-

    - name: Install dependencies
      run: |
        cd frontend/shared
        npm install
        cd ../client-portal
        npm install --force

    - name: Build for production
      env:
        VITE_API_URL: https://lifeplace-api.fly.dev
        VITE_APP_ENV: production
        VITE_SENTRY_RELEASE: "client-portal@${{ github.sha }}"
        VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN_CLIENT_PORTAL }}
        VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      run: |
        cd frontend/client-portal
        npm run build

    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        npx wrangler@3 pages deploy frontend/client-portal/build/client \
          --project-name=lifeplace-portal \
          --branch=main \
          --commit-hash=${{ github.sha }} \
          --commit-message="$(git log -1 --pretty=%s)"

  # Job 4: Deploy Backend to Fly.io (only on main branch)
  deploy-backend:
    needs: [test-backend, test-admin-crm, test-client-portal]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Setup Fly.io CLI
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Record deploy start time
      id: deploy_timing
      run: echo "start_time=$(date -u +%Y-%m-%dT%H:%M:%S)" >> $GITHUB_OUTPUT

    - name: Set Sentry release on Fly.io
      run: |
        cd backend
        flyctl secrets set SENTRY_RELEASE="lifeplace-api@${{ github.sha }}" --stage

    - name: Deploy to Fly.io
      run: |
        cd backend
        flyctl deploy --remote-only
        # Note: Migrations run automatically via release_command in fly.toml

    - name: Verify deployment health
      run: |
        sleep 10
        curl -f https://lifeplace-api.fly.dev/health/ || exit 1
        echo "✅ Backend health check passed"

    - name: Record deployment
      if: always()
      env:
        DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
      run: |
        DEPLOY_STATUS="SUCCESS"
        if [ "${{ job.status }}" != "success" ]; then
          DEPLOY_STATUS="FAILURE"
        fi
        COMMIT_MSG=$(git log -1 --pretty=%s | head -c 500)
        COMMIT_TS=$(git log -1 --pretty=%aI)

        # Record deployment via API (silently fail if endpoint not yet deployed)
        curl -sf -X POST https://lifeplace-api.fly.dev/api/infrastructure/record-deploy/ \
          -H "X-Deploy-Secret: ${DEPLOY_SECRET}" \
          -H "Content-Type: application/json" \
          -d "{
            \"git_sha\": \"${{ github.sha }}\",
            \"commit_message\": \"${COMMIT_MSG}\",
            \"commit_timestamp\": \"${COMMIT_TS}\",
            \"service\": \"backend\",
            \"environment\": \"production\",
            \"github_run_id\": \"${{ github.run_id }}\",
            \"github_run_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
            \"triggered_by\": \"${{ github.event_name }}\",
            \"deploy_started_at\": \"${{ steps.deploy_timing.outputs.start_time }}\",
            \"status\": \"${DEPLOY_STATUS}\"
          }" || echo "Deploy recording skipped (endpoint may not be deployed yet)"

  # Job 4: Create Sentry Releases
  sentry-release:
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Sentry CLI
      run: curl -sL https://sentry.io/get-cli/ | bash

    - name: Create Sentry releases and associate commits
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      run: |
        VERSION="${{ github.sha }}"

        for PROJECT in lifeplace-api admin-crm client-portal; do
          RELEASE="${PROJECT}@${VERSION}"

          sentry-cli releases new "$RELEASE" --project "$PROJECT" || true
          sentry-cli releases set-commits "$RELEASE" --auto --project "$PROJECT" || true
          sentry-cli releases finalize "$RELEASE" --project "$PROJECT" || true

          echo "✅ Created Sentry release: $RELEASE"
        done

  # Job 7: Deployment Summary
  notify:
    needs: [test-backend, test-admin-crm, test-client-portal, deploy-backend, deploy-admin-crm, deploy-client-portal, sentry-release]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Deployment Status
      run: |
        echo "🚀 LifePlace Deployment Summary"
        echo "================================"
        echo ""
        echo "Backend Tests:          ${{ needs.test-backend.result }}"
        echo "Admin CRM Tests:        ${{ needs.test-admin-crm.result }}"
        echo "Client Portal Tests:    ${{ needs.test-client-portal.result }}"
        echo "Backend Deploy:         ${{ needs.deploy-backend.result }}"
        echo "Admin CRM Deploy:       ${{ needs.deploy-admin-crm.result }}"
        echo "Client Portal Deploy:   ${{ needs.deploy-client-portal.result }}"
        echo "Sentry Release:         ${{ needs.sentry-release.result }}"
        echo ""
        echo "URLs:"
        echo "  - Backend API:     https://lifeplace-api.fly.dev"
        echo "  - Admin CRM:       https://admin.lifeplace.dev"
        echo "  - Client Portal:   https://lifeplace.dev"
        echo ""

        FAILED=false

        if [[ "${{ needs.deploy-backend.result }}" != "success" ]]; then
          echo "❌ Backend deployment failed"
          FAILED=true
        fi
        if [[ "${{ needs.deploy-admin-crm.result }}" != "success" ]]; then
          echo "❌ Admin CRM deployment failed"
          FAILED=true
        fi
        if [[ "${{ needs.deploy-client-portal.result }}" != "success" ]]; then
          echo "❌ Client Portal deployment failed"
          FAILED=true
        fi

        if [[ "$FAILED" == "true" ]]; then
          echo "⚠️  One or more deployments failed - check logs above"
          exit 1
        else
          echo "✅ All deployments successful!"
        fi
