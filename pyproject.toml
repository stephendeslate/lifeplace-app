# =============================================================================
# Python Project Configuration
# =============================================================================
# Section 14.3 - Linting Rules and Pre-commit Hooks
#
# This file configures:
# - Ruff (Python linter and formatter)
# - Bandit (Security linter)
# - pytest (Test configuration)
# =============================================================================

[project]
name = "lifeplace-backend"
version = "1.0.0"
description = "LifePlace Event Management Platform - Backend"
requires-python = ">=3.12"

# =============================================================================
# Ruff Configuration
# =============================================================================
# Ruff is an extremely fast Python linter, written in Rust.
# Replaces: flake8, isort, pyupgrade, and more
# Docs: https://docs.astral.sh/ruff/

[tool.ruff]
# Target Python version
target-version = "py312"

# Line length (matching Black defaults)
line-length = 120

# Exclude paths
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    ".mypy_cache",
    ".pytest_cache",
    "migrations",
    "node_modules",
    "dist",
    "build",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable these rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print (no print statements)
    "DJ",     # flake8-django
]

# Ignore these specific rules
ignore = [
    "E501",    # Line too long (handled by formatter)
    "B008",    # Do not perform function calls in argument defaults (common in Django)
    "B905",    # zip() without explicit strict= (Python 3.10+)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value in comparison
    "S101",    # Use of assert (needed for tests)
    "S311",    # Standard pseudo-random generators not suitable for security
    "T201",    # print() found - allow in management commands
    "ARG001",  # Unused function argument (common in Django views)
    "ARG002",  # Unused method argument (common in Django views)
    "RUF012",  # Mutable class attributes should be annotated with ClassVar
    "DJ001",   # Avoid using null=True on string-based fields (sometimes needed)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests can use print, assert, and have more relaxed rules
"**/tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "PLR2004", # Magic values allowed in tests
    "ARG",     # Unused arguments common in test fixtures
]
# Management commands can use print
"**/management/commands/**/*.py" = [
    "T201",    # print() allowed in management commands
]
# Migrations have auto-generated code
"**/migrations/**/*.py" = [
    "E501",    # Line length
    "ERA001",  # Commented-out code
]
# Settings file has special Django patterns
"**/settings.py" = [
    "E501",    # Line length for URLs and configs
]
# conftest files have fixture patterns
"**/conftest.py" = [
    "ARG001",  # Unused arguments in fixtures
]

[tool.ruff.lint.isort]
# Import sorting configuration
known-first-party = ["core"]
known-django = ["django", "rest_framework"]
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like datetime.now()
extend-immutable-calls = [
    "django.utils.timezone.now",
    "django.db.models.UUIDField",
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Unix-style line endings
line-ending = "lf"

# =============================================================================
# Bandit Configuration (Security Linting)
# =============================================================================
# Bandit is a security linter for Python code
# Docs: https://bandit.readthedocs.io/

[tool.bandit]
# Target directories
targets = ["backend"]

# Skip specific tests
skips = [
    "B101",  # assert_used - needed for tests
    "B311",  # random - not used for crypto
]

# Exclude directories
exclude_dirs = [
    "tests",
    "migrations",
    ".venv",
    "venv",
]

# =============================================================================
# Pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["backend/core"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["backend/core"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/management/commands/*",
    "*/admin.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if settings.DEBUG:",
]
show_missing = true
fail_under = 60
