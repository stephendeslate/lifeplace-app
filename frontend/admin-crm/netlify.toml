# lifeplace-app/frontend/admin-crm/netlify.toml
[build]
  base = "frontend/admin-crm"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  VITE_API_URL = "https://lifeplace-api.fly.dev"
  VITE_APP_ENV = "production"