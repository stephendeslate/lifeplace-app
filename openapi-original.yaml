openapi: 3.0.3
info:
  title: LifePlace API
  version: 1.0.0
  description: >
    Comprehensive API documentation for LifePlace Event Management Platform.
    Built with Django REST Framework following Domain-Driven Design principles.
    This CRM system manages the complete event lifecycle from booking flows 
    to payment processing, contracts, and client communications.
  contact:
    name: LifePlace API Support
    url: https://api.crm.example.com/support
  license:
    name: Proprietary
    url: https://api.crm.example.com/license

servers:
  - url: https://api.crm.example.com/v1
    description: Production server
  - url: https://staging-api.crm.example.com/v1
    description: Staging server
  - url: http://localhost:8000
    description: Development server

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User account management and administration
  - name: Clients
    description: Client management and invitations
  - name: Events
    description: Event lifecycle management and client portal
  - name: BookingFlow
    description: Multi-step booking flow engine with dynamic forms
  - name: Communications
    description: Email/SMS templates and messaging system
  - name: Products
    description: Product catalog, categories, and pricing management
  - name: Payments
    description: Payment processing, invoicing, and gateway management
  - name: Sales
    description: Quote generation and management system
  - name: Questionnaires
    description: Dynamic form builder and response management
  - name: Workflows
    description: Workflow automation and stage management
  - name: Contracts
    description: Contract generation, signatures, and amendments
  - name: Notes
    description: Universal notes system with cross-domain support
  - name: Notifications
    description: Multi-channel notification and preference management
  - name: Analytics
    description: Event tracking, reporting, and business intelligence

paths:
  # Authentication Endpoints
  /api/users/token/:
    post:
      tags: [Authentication]
      summary: Obtain JWT token pair
      description: Get access and refresh tokens for authentication
      operationId: token_obtain_pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Tokens generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  refresh:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/token/refresh/:
    post:
      tags: [Authentication]
      summary: Refresh JWT access token
      description: Generate new access token using refresh token
      operationId: token_refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh:
                  type: string
      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/login/:
    post:
      tags: [Authentication]
      summary: Enhanced user login
      description: Login with enhanced security and JWT token generation
      operationId: user_login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  access:
                    type: string
                  refresh:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/users/logout/:
    post:
      tags: [Authentication]
      summary: Secure logout
      description: Logout with JWT token blacklisting
      operationId: secure_logout
      responses:
        '200':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/logout-all/:
    post:
      tags: [Authentication]
      summary: Logout from all devices
      description: Logout from all devices by blacklisting all tokens
      operationId: logout_all_devices
      responses:
        '200':
          description: Logged out from all devices
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/sessions/:
    get:
      tags: [Authentication]
      summary: Get active sessions
      description: Get list of active JWT sessions
      operationId: active_sessions
      responses:
        '200':
          description: Active sessions retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    token_id:
                      type: string
                    issued_at:
                      type: string
                      format: date-time
                    expires_at:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/register/:
    post:
      tags: [Authentication]
      summary: Client registration
      description: Public client registration endpoint
      operationId: client_register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Client registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  access:
                    type: string
                  refresh:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # User Management
  /api/users/:
    get:
      tags: [Users]
      summary: List users
      description: Get paginated list of users with search functionality
      operationId: list_users
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create user
      description: Create a new user account
      operationId: create_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}/:
    get:
      tags: [Users]
      summary: Get user details
      description: Get detailed information about a specific user
      operationId: get_user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update user
      description: Update user account information
      operationId: update_user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Partially update user
      description: Partially update user account information
      operationId: partial_update_user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Delete user
      description: Delete user account
      operationId: delete_user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: User deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/me/:
    get:
      tags: [Users]
      summary: Get current user profile
      description: Get current authenticated user's profile
      operationId: current_user_profile
      responses:
        '200':
          description: Current user profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Users]
      summary: Update current user profile
      description: Update current authenticated user's profile
      operationId: update_current_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/change-password/:
    post:
      tags: [Users]
      summary: Change password
      description: Change current user's password
      operationId: change_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '200':
          description: Password changed successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/invitations/:
    get:
      tags: [Users]
      summary: List admin invitations
      description: Get list of admin invitations
      operationId: list_admin_invitations
      responses:
        '200':
          description: Admin invitations retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create admin invitation
      description: Send invitation to create admin account
      operationId: create_admin_invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInvitation'
      responses:
        '201':
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/invitations/{id}/:
    get:
      tags: [Users]
      summary: Get invitation details
      description: Get details of admin invitation
      operationId: get_admin_invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security: []
      responses:
        '200':
          description: Invitation details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvitation'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Delete invitation
      description: Delete admin invitation
      operationId: delete_admin_invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitation deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/invitations/{invitation_id}/accept/:
    post:
      tags: [Users]
      summary: Accept admin invitation
      description: Accept invitation and create admin account
      operationId: accept_admin_invitation
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm_password]
              properties:
                password:
                  type: string
                  format: password
                confirm_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Invitation accepted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # Client Management
  /api/clients/:
    get:
      tags: [Clients]
      summary: List clients
      description: Get paginated list of clients with search functionality
      operationId: list_clients
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Clients retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Clients]
      summary: Create client
      description: Create a new client account
      operationId: create_client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateUpdate'
      responses:
        '201':
          description: Client created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/clients/{id}/:
    get:
      tags: [Clients]
      summary: Get client details
      description: Get detailed information about a specific client
      operationId: get_client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Client details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clients]
      summary: Update client
      description: Update client information
      operationId: update_client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateUpdate'
      responses:
        '200':
          description: Client updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Clients]
      summary: Partially update client
      description: Partially update client information
      operationId: partial_update_client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateUpdate'
      responses:
        '200':
          description: Client updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Clients]
      summary: Delete client
      description: Delete client account
      operationId: delete_client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Client deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/clients/{id}/events/:
    get:
      tags: [Clients]
      summary: Get client events
      description: Get all events associated with a specific client
      operationId: get_client_events
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Client events retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/clients/{id}/active/:
    get:
      tags: [Clients]
      summary: Get active clients
      description: Get only active clients
      operationId: get_active_clients
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Active clients retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/clients/{id}/send_invitation/:
    post:
      tags: [Clients]
      summary: Send client invitation
      description: Send invitation to client for account setup
      operationId: send_client_invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invitation sent successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/clients/invitations/:
    get:
      tags: [Clients]
      summary: List client invitations
      description: Get list of client invitations
      operationId: list_client_invitations
      responses:
        '200':
          description: Client invitations retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Clients]
      summary: Create client invitation
      description: Create a new client invitation
      operationId: create_client_invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInvitation'
      responses:
        '201':
          description: Client invitation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInvitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/clients/invitations/{id}/:
    get:
      tags: [Clients]
      summary: Get client invitation details
      description: Get details of client invitation
      operationId: get_client_invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security: []
      responses:
        '200':
          description: Invitation details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInvitation'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/clients/invitations/{id}/accept/:
    post:
      tags: [Clients]
      summary: Accept client invitation
      description: Accept client invitation and set up account
      operationId: accept_client_invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptClientInvitation'
      responses:
        '200':
          description: Invitation accepted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # Events Management
  /api/events/event-types/:
    get:
      tags: [Events]
      summary: List event types
      description: Get list of available event types
      operationId: list_event_types
      security: []
      parameters:
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Event types retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Events]
      summary: Create event type
      description: Create a new event type
      operationId: create_event_type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventType'
      responses:
        '201':
          description: Event type created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/events/event-types/{id}/:
    get:
      tags: [Events]
      summary: Get event type details
      description: Get detailed information about an event type
      operationId: get_event_type
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event type details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Events]
      summary: Update event type
      description: Update event type information
      operationId: update_event_type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventType'
      responses:
        '200':
          description: Event type updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
