components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service-to-service communication

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    SearchParam:
      name: search
      in: query
      description: Search query string
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request - validation errors or invalid data
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
              errors:
                type: object
                additionalProperties: true
    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Authentication credentials were not provided."
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "You do not have permission to perform this action."
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Not found."
    TooManyRequests:
      description: Too many requests - rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Request was throttled. Expected available in X seconds."

  schemas:
    # Core User Schemas
    UserProfile:
      type: object
      properties:
        phone:
          type: string
          nullable: true
        company:
          type: string
          nullable: true

    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [ADMIN, CLIENT]
          default: CLIENT
        is_active:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        profile:
          $ref: '#/components/schemas/UserProfile'
      required:
        - email
        - first_name
        - last_name

    UserCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
        confirm_password:
          type: string
          format: password
          writeOnly: true
        profile:
          $ref: '#/components/schemas/UserProfile'
      required:
        - email
        - first_name
        - last_name
        - password
        - confirm_password

    UserLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
        remember_me:
          type: boolean
          default: false
      required:
        - email
        - password

    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
          format: password
          writeOnly: true
        new_password:
          type: string
          format: password
          writeOnly: true
        confirm_password:
          type: string
          format: password
          writeOnly: true
      required:
        - old_password
        - new_password
        - confirm_password

    AdminInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
        invited_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
      required:
        - email

    # Client Management Schemas
    ClientProfile:
      type: object
      properties:
        phone:
          type: string
          nullable: true
        company:
          type: string
          nullable: true

    ClientList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
          readOnly: true
        profile:
          $ref: '#/components/schemas/ClientProfile'
        has_account:
          type: boolean
          readOnly: true

    ClientDetail:
      allOf:
        - $ref: '#/components/schemas/ClientList'
        - type: object
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/Event'
              readOnly: true

    ClientCreateUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
        profile:
          $ref: '#/components/schemas/ClientProfile'
      required:
        - email
        - first_name
        - last_name

    ClientInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        client:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
      required:
        - client

    AcceptClientInvitation:
      type: object
      properties:
        password:
          type: string
          format: password
          writeOnly: true
        confirm_password:
          type: string
          format: password
          writeOnly: true
      required:
        - password
        - confirm_password

    # Event Management Schemas
    EventType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        description:
          type: string
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - name

    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        description:
          type: string
        client:
          type: integer
        event_type:
          type: integer
        status:
          type: string
          enum: [INQUIRY, CONSULTATION, PROPOSAL_SENT, CONTRACTED, PLANNING, EXECUTION, COMPLETED, CANCELLED]
          default: INQUIRY
        event_date:
          type: string
          format: date-time
          nullable: true
        venue:
          type: string
          nullable: true
        budget:
          type: number
          format: decimal
          nullable: true
        guest_count:
          type: integer
          nullable: true
        current_stage:
          type: integer
          nullable: true
        last_contacted:
          type: string
          format: date-time
          nullable: true
        next_follow_up:
          type: string
          format: date-time
          nullable: true
        preferences:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - name
        - client
        - event_type

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            client_details:
              $ref: '#/components/schemas/ClientList'
            event_type_details:
              $ref: '#/components/schemas/EventType'
            tasks:
              type: array
              items:
                $ref: '#/components/schemas/EventTask'
            product_options:
              type: array
              items:
                $ref: '#/components/schemas/EventProductOption'
            workflow_progress:
              type: number
              format: float
              readOnly: true
            next_task:
              $ref: '#/components/schemas/EventTask'
              nullable: true
              readOnly: true

    EventCreateUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        client:
          type: integer
        event_type:
          type: integer
        status:
          type: string
          enum: [INQUIRY, CONSULTATION, PROPOSAL_SENT, CONTRACTED, PLANNING, EXECUTION, COMPLETED, CANCELLED]
        event_date:
          type: string
          format: date-time
          nullable: true
        venue:
          type: string
          nullable: true
        budget:
          type: number
          format: decimal
          nullable: true
        guest_count:
          type: integer
          nullable: true
        preferences:
          type: object
          additionalProperties: true
          nullable: true
        tasks:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              assigned_to:
                type: integer
                nullable: true
              due_date:
                type: string
                format: date-time
                nullable: true
              priority:
                type: string
                enum: [LOW, MEDIUM, HIGH, URGENT]
        product_options:
          type: array
          items:
            type: object
            properties:
              product_option:
                type: integer
              quantity:
                type: integer
              custom_price:
                type: number
                format: decimal
                nullable: true
      required:
        - name
        - client
        - event_type

    EventTask:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
        title:
          type: string
        description:
          type: string
        assigned_to:
          type: integer
          nullable: true
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, CANCELLED]
          default: PENDING
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
          default: MEDIUM
        due_date:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        assigned_user:
          $ref: '#/components/schemas/User'
          readOnly: true
      required:
        - event
        - title

    EventProductOption:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
        product_option:
          type: integer
        quantity:
          type: integer
          default: 1
        custom_price:
          type: number
          format: decimal
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        product_details:
          $ref: '#/components/schemas/ProductOption'
          readOnly: true
      required:
        - event
        - product_option

    EventTimeline:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
        entry_type:
          type: string
          enum: [STATUS_CHANGE, NOTE, FILE_UPLOAD, TASK_UPDATE, COMMUNICATION, PAYMENT, CONTRACT]
        title:
          type: string
        description:
          type: string
        actor:
          type: integer
          nullable: true
        is_public:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor_details:
          $ref: '#/components/schemas/User'
          readOnly: true
      required:
        - event
        - entry_type
        - title

    EventFile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
        name:
          type: string
        file:
          type: string
          format: uri
        file_type:
          type: string
          enum: [DOCUMENT, IMAGE, CONTRACT, INVOICE, OTHER]
          default: OTHER
        is_public:
          type: boolean
          default: false
        uploaded_by:
          type: integer
          nullable: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        file_size:
          type: integer
          readOnly: true
        file_url:
          type: string
          format: uri
          readOnly: true
      required:
        - event
        - name
        - file

    EventFeedback:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
        client:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        feedback_text:
          type: string
        feedback_type:
          type: string
          enum: [GENERAL, SERVICE, VENUE, FOOD, PLANNING, OTHER]
          default: GENERAL
        is_testimonial:
          type: boolean
          default: false
        admin_response:
          type: string
          nullable: true
        responded_by:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - event
        - client
        - rating

    # Client Event Schemas
    ClientEventDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        event_type:
          $ref: '#/components/schemas/EventType'
          readOnly: true
        status:
          type: string
          readOnly: true
        event_date:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        venue:
          type: string
          nullable: true
          readOnly: true
        preferences:
          type: object
          additionalProperties: true

    # BookingFlow Schemas
    BookingFlow:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        description:
          type: string
        event_type:
          type: integer
        is_active:
          type: boolean
          default: true
        allowed_payment_gateways:
          type: array
          items:
            type: integer
        redirect_url_success:
          type: string
          format: uri
          nullable: true
        redirect_url_cancel:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - name
        - event_type

    BookingFlowDetail:
      allOf:
        - $ref: '#/components/schemas/BookingFlow'
        - type: object
          properties:
            steps:
              type: array
              items:
                $ref: '#/components/schemas/BookingFlowStep'
            event_type_details:
              $ref: '#/components/schemas/EventType'
              readOnly: true

    BookingFlowCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        event_type:
          type: integer
        is_active:
          type: boolean
          default: true
        allowed_payment_gateways:
          type: array
          items:
            type: integer
        redirect_url_success:
          type: string
          format: uri
          nullable: true
        redirect_url_cancel:
          type: string
          format: uri
          nullable: true
      required:
        - name
        - event_type

    BookingFlowUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        allowed_payment_gateways:
          type: array
          items:
            type: integer
        redirect_url_success:
          type: string
          format: uri
          nullable: true
        redirect_url_cancel:
          type: string
          format: uri
          nullable: true

    BookingFlowStep:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        booking_flow:
          type: integer
        step_type:
          type: string
          enum: [INTRODUCTION, CONTACT_INFO, DATETIME, PACKAGE_SELECTION, ADDON_SELECTION, QUESTIONNAIRE, PAYMENT_INFO, PRICING_SUMMARY, CONFIRMATION]
        name:
          type: string
        order:
          type: integer
        is_required:
          type: boolean
          default: true
        is_active:
          type: boolean
          default: true
        configuration:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
