          enum: [SCHEDULED, ON_DEMAND]
        configuration:
          type: object
          additionalProperties: true
        schedule:
          type: string
          nullable: true
        is_active:
          type: boolean
          default: true
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - name
        - report_type
        - created_by

